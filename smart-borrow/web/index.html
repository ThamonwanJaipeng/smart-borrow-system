<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Smart Borrow System</title>

  <style>

    body{
      background:#111827;
      color:white;
      font-family:Arial;
      padding:40px;
    }

    .card{
      background:#1f2937;
      padding:30px;
      border-radius:20px;
      max-width:500px;
      margin:auto;
      box-shadow:0 0 20px rgba(0,0,0,.5);
    }

    h1{
      color:#38bdf8;
    }

    button{
      background:#06b6d4;
      color:white;
      border:none;
      padding:12px 20px;
      border-radius:10px;
      cursor:pointer;
      margin-top:20px;
      width:100%;
      font-size:18px;
    }

    input{
      width:100%;
      padding:12px;
      border-radius:10px;
      border:none;
      margin-top:10px;
      margin-bottom:10px;
    }

  </style>

</head>

<body>

  <div class="card">

    <h1>📦 Smart Borrow System</h1>

    <p>ระบบยืมอุปกรณ์บน Home Assistant</p>

    <input type="text" placeholder="ชื่อผู้ยืม">

    <input type="text" placeholder="รายการอุปกรณ์">

    <button>ยืนยันการยืม</button>

  </div>

</body>
</html>
