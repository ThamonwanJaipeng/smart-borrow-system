<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Borrow System</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#081225;
    color:white;
}

.container{
    width:450px;
    margin:60px auto;
    background:#1b263b;
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,.5);
}

h1{
    color:#38bdf8;
}

input,select{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    margin-top:15px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    margin-top:20px;
    background:#06b6d4;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0891b2;
}

.status{
    margin-top:20px;
    background:#0f172a;
    padding:15px;
    border-radius:10px;
}

.card{
    margin-top:20px;
    padding:15px;
    background:#111827;
    border-radius:10px;
}

.online{
    color:#22c55e;
}

.offline{
    color:red;
}

</style>

</head>

<body>

<div class="container">

<h1>📦 Smart Borrow System</h1>

<p id="connection">
🔴 ไม่ได้เชื่อมต่อ
</p>

<input
    id="borrower"
    type="text"
    placeholder="ชื่อผู้ยืม"
>

<select id="item">

<option>Notebook Dell</option>
<option>iPad Air</option>
<option>Camera Canon</option>
<option>HDMI Cable</option>

</select>

<button onclick="borrowItem()">
ยืนยันการยืม
</button>

<div class="status">

<h3>สถานะล่าสุด</h3>

<div class="card">

<p>
👤 ผู้ยืม:
<span id="showBorrower">-</span>
</p>

<p>
📦 อุปกรณ์:
<span id="showItem">-</span>
</p>

<p>
📌 สถานะ:
<span id="showStatus">-</span>
</p>

</div>

</div>

</div>

<script>

//////////////////////////////////////////////////////////
// CONFIG
//////////////////////////////////////////////////////////

const HA_URL =
    "ws://homeassistant.local:8123/api/websocket";

const TOKEN =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiI1YmQ0NjA5MGExNWI0ZTNkOTFiNmJjMDE2YWE3MjkxNSIsImlhdCI6MTc3ODU3MTQzNiwiZXhwIjoyMDkzOTMxNDM2fQ.lK2-9bB_qf3MRGFCs5TCvYVNJnquIaHlLeSpQZJFhmA";

//////////////////////////////////////////////////////////
// WEBSOCKET
//////////////////////////////////////////////////////////

let socket;

connectWebSocket();

function connectWebSocket(){

    socket = new WebSocket(HA_URL);

    socket.onopen = () => {

        console.log("Connected");

    };

    socket.onmessage = (event) => {

        const data =
            JSON.parse(event.data);

        //////////////////////////////////////////////////
        // AUTH REQUIRED
        //////////////////////////////////////////////////

        if(data.type === "auth_required"){

            socket.send(JSON.stringify({

                type:"auth",

                access_token:TOKEN

            }));

        }

        //////////////////////////////////////////////////
        // AUTH OK
        //////////////////////////////////////////////////

        if(data.type === "auth_ok"){

            document
                .getElementById("connection")
                .innerHTML =
                "🟢 เชื่อมต่อ Home Assistant แล้ว";

            //////////////////////////////////////////////////
            // SUBSCRIBE STATES
            //////////////////////////////////////////////////

            socket.send(JSON.stringify({

                id:1,

                type:"subscribe_events",

                event_type:"state_changed"

            }));

            //////////////////////////////////////////////////
            // GET STATES
            //////////////////////////////////////////////////

            getCurrentStates();
        }

        //////////////////////////////////////////////////
        // STATE CHANGED
        //////////////////////////////////////////////////

        if(data.type === "event"){

            updateRealtime(data);
        }
    };

    socket.onerror = () => {

        document
            .getElementById("connection")
            .innerHTML =
            "🔴 เชื่อมต่อไม่สำเร็จ";
    };
}

//////////////////////////////////////////////////////////
// GET STATES
//////////////////////////////////////////////////////////

function getCurrentStates(){

    socket.send(JSON.stringify({

        id:2,

        type:"get_states"

    }));
}

//////////////////////////////////////////////////////////
// UPDATE REALTIME
//////////////////////////////////////////////////////////

function updateRealtime(data){

    const entity =
        data.event.data.entity_id;

    const newState =
        data.event.data.new_state;

    if(!newState) return;

    //////////////////////////////////////////////////////
    // BORROWER
    //////////////////////////////////////////////////////

    if(entity === "input_text.borrower_name"){

        document
            .getElementById("showBorrower")
            .innerHTML =
            newState.state;
    }

    //////////////////////////////////////////////////////
    // ITEM
    //////////////////////////////////////////////////////

    if(entity === "input_select.borrow_item"){

        document
            .getElementById("showItem")
            .innerHTML =
            newState.state;
    }

    //////////////////////////////////////////////////////
    // STATUS
    //////////////////////////////////////////////////////

    if(entity === "input_select.borrow_status"){

        document
            .getElementById("showStatus")
            .innerHTML =
            newState.state;
    }
}

//////////////////////////////////////////////////////////
// CALL SERVICE
//////////////////////////////////////////////////////////

function callService(
    id,
    domain,
    service,
    data
){

    socket.send(JSON.stringify({

        id:id,

        type:"call_service",

        domain:domain,

        service:service,

        service_data:data

    }));
}

//////////////////////////////////////////////////////////
// BORROW
//////////////////////////////////////////////////////////

function borrowItem(){

    const borrower =
        document.getElementById("borrower").value;

    const item =
        document.getElementById("item").value;

    //////////////////////////////////////////////////////
    // SET BORROWER
    //////////////////////////////////////////////////////

    callService(

        10,

        "input_text",

        "set_value",

        {
            entity_id:
                "input_text.borrower_name",

            value:
                borrower
        }
    );

    //////////////////////////////////////////////////////
    // SET ITEM
    //////////////////////////////////////////////////////

    callService(

        11,

        "input_select",

        "select_option",

        {
            entity_id:
                "input_select.borrow_item",

            option:
                item
        }
    );

    //////////////////////////////////////////////////////
    // SET STATUS
    //////////////////////////////////////////////////////

    callService(

        12,

        "input_select",

        "select_option",

        {
            entity_id:
                "input_select.borrow_status",

            option:
                "ถูกยืม"
        }
    );

    //////////////////////////////////////////////////////
    // RUN SCRIPT
    //////////////////////////////////////////////////////

    callService(

        13,

        "script",

        "borrow_item_script",

        {}
    );
}

</script>

</body>
</html>
