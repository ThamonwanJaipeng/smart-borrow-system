<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Borrow System</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#081225;
    color:white;
}

.container{
    width:420px;
    margin:80px auto;
    background:#1b263b;
    padding:30px;
    border-radius:20px;
}

h1{
    color:#38bdf8;
}

input,select{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    background:#06b6d4;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.status{
    margin-top:20px;
    text-align:center;
}

</style>

</head>

<body>

<div class="container">

<h1>📦 Smart Borrow System</h1>

<p>ระบบยืมอุปกรณ์เชื่อม Home Assistant</p>

<input
    id="borrower"
    type="text"
    placeholder="ชื่อผู้ยืม"
>

<select id="item">

    <option>Notebook Dell</option>
    <option>iPad Air</option>
    <option>Camera Canon</option>
    <option>HDMI Cable</option>

</select>

<button onclick="borrowItem()">
ยืนยันการยืม
</button>

<div class="status" id="status"></div>

</div>

<script>

//////////////////////////////////////////////////////
// CONFIG
//////////////////////////////////////////////////////

const HA_URL =
    "http://homeassistant.local:8123";

const TOKEN =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiI1YmQ0NjA5MGExNWI0ZTNkOTFiNmJjMDE2YWE3MjkxNSIsImlhdCI6MTc3ODU3MTQzNiwiZXhwIjoyMDkzOTMxNDM2fQ.lK2-9bB_qf3MRGFCs5TCvYVNJnquIaHlLeSpQZJFhmA";

//////////////////////////////////////////////////////
// API CALL
//////////////////////////////////////////////////////

async function callService(
    domain,
    service,
    data
){

    const response = await fetch(

        `${HA_URL}/api/services/${domain}/${service}`,

        {
            method:"POST",

            headers:{
                "Authorization":
                    `Bearer ${TOKEN}`,

                "Content-Type":
                    "application/json"
            },

            body:JSON.stringify(data)
        }
    );

    return response;
}

//////////////////////////////////////////////////////
// BORROW
//////////////////////////////////////////////////////

async function borrowItem(){

    const borrower =
        document.getElementById("borrower").value;

    const item =
        document.getElementById("item").value;

    //////////////////////////////////////////////////
    // BORROWER NAME
    //////////////////////////////////////////////////

    await callService(

        "input_text",
        "set_value",

        {
            entity_id:
                "input_text.borrower_name",

            value:
                borrower
        }
    );

    //////////////////////////////////////////////////
    // ITEM
    //////////////////////////////////////////////////

    await callService(

        "input_select",
        "select_option",

        {
            entity_id:
                "input_select.borrow_item",

            option:
                item
        }
    );

    //////////////////////////////////////////////////
    // STATUS
    //////////////////////////////////////////////////

    await callService(

        "input_select",
        "select_option",

        {
            entity_id:
                "input_select.borrow_status",

            option:
                "ถูกยืม"
        }
    );

    //////////////////////////////////////////////////
    // RUN SCRIPT
    //////////////////////////////////////////////////

    await callService(

        "script",
        "borrow_item_script",

        {}
    );

    //////////////////////////////////////////////////
    // SUCCESS
    //////////////////////////////////////////////////

    document.getElementById("status")
        .innerHTML =
        "✅ บันทึกข้อมูลสำเร็จ";

}

</script>

</body>
</html>
